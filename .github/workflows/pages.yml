name: GitHub Pages

on:
  push:
    branches: [demos-ui-2026-11-13]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            demo-primevue4/package-lock.json
            demo-shadcn-vue/package-lock.json
            demo-naiveui/package-lock.json
      - name: Build demos
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          for demo in demo-primevue4 demo-shadcn-vue demo-naiveui; do
            (cd "$demo" && npm ci && npm run build)
            mkdir -p "_site/$demo"
            cp -R "$demo/dist/." "_site/$demo/"
          done
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
